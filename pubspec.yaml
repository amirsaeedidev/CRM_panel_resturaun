name: crm_panel
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  supabase: ^2.13.4
  supabase_flutter: ^2.15.4
  flutter_dotenv: ^6.0.1
  go_router: ^17.3.0
  image_picker: ^1.2.3
  cached_network_image: ^3.4.1
  flutter_svg: ^2.3.0
  uuid: ^4.5.3
  intl: ^0.20.3
  fl_chart: ^1.2.0
  flutter_spinkit: ^5.2.2
  shimmer: ^3.0.0
  responsive_framework: ^1.5.1
  shared_preferences: ^2.5.5
  file_picker: ^11.0.2
  http: ^1.6.0
  connectivity_plus: ^7.2.0
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.1
  permission_handler: ^12.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4 # Added for mocking dependencies in unit and widget tests
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
  - .env
  - assets/images/app_icon.png

  fonts:
    - family: Lalezar
      fonts:
        - asset: assets/fonts/Lalezar.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"